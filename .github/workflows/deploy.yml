name: CI & Deploy

# CI runs on every PR and every push to main. Deploy is gated: build-and-deploy `needs` the CI
# lane and runs only on push to main, so a red suite can never reach Azure. (`needs` can only
# reference jobs in the same workflow file, hence CI and deploy live together here.)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: no stored secrets — federated credential authenticates to Azure (deploy job only).
permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPO: opspilot

jobs:
  # One lane. It installs what the application needs and runs the whole deterministic suite; there
  # is no heavier lane behind it, because nothing in the tree needs a machine-learning dependency
  # to be checked. Retrieval ranks deterministically and loads no local model.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Sync (dev + data)
        run: uv sync --group dev --group data
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: No plan or document vocabulary outside docs
        # Stage, phase, gap, and slice identifiers name a sequence that docs/ owns, and a section
        # number cites a place in a document rather than a reason. Both go stale the moment the
        # document moves, and neither tells a reader what the code does or which contract it
        # satisfies. Decision references (D-nnn) are excluded on purpose: a decision is a settled
        # choice the code implements, not a position in a plan or a location in a file.
        #
        # There is no exempt list. It held modules scheduled for deletion, and they are deleted.
        run: |
          pattern='\bStage [0-9]|\bPhase [0-9]|\bG-[0-9]{2}|\bslices? [0-9]+\.[0-9]|\.md.{0,3}§'
          matches=$(git ls-files | grep -vE '^docs/' \
            | xargs -r -d '\n' grep -nEH --binary-files=without-match "$pattern" || true)
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Plan and document vocabulary belong in docs/. Say what the code does and which contract it satisfies."
            exit 1
          fi
      - name: Type-check
        run: uv run mypy
      - name: Tests (ML-gated tests skip here)
        # `not llm` excludes the case that calls the live deployment; the seam's wiring is covered
        # deterministically by the cassette/factory tests, which need no live model.
        run: uv run pytest -q -m "not llm"

  build-and-deploy:
    needs: [core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync (dev) — httpx + opspilot for the smoke-test script
        run: uv sync --group dev

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: az acr build --registry "${{ vars.ACR_NAME }}" --image "$IMAGE_REPO:${{ github.sha }}" .

      # Before the image is deployed anywhere. The protocol itself is proven in the test suite;
      # what only the image can answer is whether it ships what serving the protocol needs, and a
      # dependency moved into a development group would leave every test passing and this failing.
      # Listing the one tool reaches no store, so this needs no credential beyond the pull.
      # Before the image is deployed anywhere. The protocol itself is proven in the test
      # suite; what only the image can answer is whether it ships what serving the protocol
      # needs, and an SDK moved into a development group would leave every test passing and
      # this failing. Listing the one tool reaches no store, so this needs no credential
      # beyond the pull.
      - name: MCP exposure in the built image (starts, offers one tool)
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker run --rm "${{ vars.ACR_NAME }}.azurecr.io/$IMAGE_REPO:${{ github.sha }}" uv run --frozen --no-dev --group llm python -c "import asyncio; from opspilot.mcp.server import build_server, EXPOSED_CAPABILITY; offered = [tool.name for tool in asyncio.run(build_server().list_tools())]; assert offered == [EXPOSED_CAPABILITY], offered; print('the image serves exactly:', offered)"

      # ACR pull-via-identity is configured declaratively by the Bicep (configureAcrPull=true),
      # NOT a separate `az containerapp registry set`: that ran BEFORE this declarative deploy, which
      # (with no registries block) then nulled it out — so the next fresh image failed to pull (401
      # ImagePullBackOff) and the old cached revision kept serving. The role already exists
      # (manageAcrPullRoleAssignment=false), so binding in the template is safe and durable.
      - name: Deploy infra (image, ingress, probes, ACR pull — declarative)
        id: deploy
        run: |
          FQDN=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "opspilot-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters \
              acrName="${{ vars.ACR_NAME }}" \
              containerImage="${{ vars.ACR_NAME }}.azurecr.io/$IMAGE_REPO:${{ github.sha }}" \
              manageAcrPullRoleAssignment=false \
              configureAcrPull=true \
              entraApiAudience="${{ vars.ENTRA_API_AUDIENCE }}" \
              entraConsoleClientId="${{ vars.ENTRA_CONSOLE_CLIENT_ID }}" \
            --query properties.outputs.appFqdn.value -o tsv)
          echo "app_fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test (one real investigation)
        # Where end-to-end proof lives. Readiness only establishes that the revision can accept
        # work; this drives a whole investigation against the deployed revision, so the model
        # call, retrieval, and the delivered brief are exercised once per deploy rather than
        # continuously by a probe.
        run: uv run python scripts/smoke_deployment.py "https://${{ steps.deploy.outputs.app_fqdn }}"
