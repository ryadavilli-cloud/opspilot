[project]
name = "opspilot"
version = "0.1.0"
description = "Agentic AI incident-investigation assistant on Azure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "mcp>=1.28.1",
    # Lexical BM25 index, the deterministic runtime retrieval backend. Pure-Python and tiny
    # enough to ship in the runtime image.
    "rank-bm25>=0.2.2",
    # Cosmos data-plane client. A base dependency because every Cosmos read the application makes
    # runs from the runtime image: the knowledge container, the operational records, and the
    # completed-investigation store. Keyless via the managed identity.
    "azure-cosmos>=4.7",
]

[dependency-groups]
data = [
    "numpy>=2.5.0",
    "pandas>=3.0.3",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "httpx>=0.27",  # FastAPI TestClient transport (API smoke tests)
]
# Azure OpenAI client. `azure-identity` powers keyless auth as the environment's identity, so
# the deployed image needs no key. Imported lazily, because cassette replay needs none of it;
# the production image installs this group (Dockerfile `--group llm`) to reach the deployment.
llm = [
    "openai>=1.40",
    "azure-identity>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
files = ["src/opspilot", "scripts"]
mypy_path = "src"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
# `tests` is on the path so the shared container fake and the answer-key loader are imported by
# name rather than relying on pytest's rootdir insertion, and `eval` so the evaluation's own tests
# import it the same way the runner does.
pythonpath = ["src", "tests", "eval"]
testpaths = ["tests"]
markers = [
    "llm: calls the live Azure OpenAI chat deployment; excluded from the CI gate lane with -m 'not llm'. Wiring is covered deterministically by cassette replay, which needs no live model.",
]
