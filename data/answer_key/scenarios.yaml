# RetailEase incident scenarios — THE ANSWER KEY.
#
# This is the source of truth every downstream artifact derives from and is scored against:
#   * 2b telemetry (logs/metrics/deploys/deps) is generated so that every `expected_evidence`
#     ref below resolves to a real row.
#   * 2c alerts.json / incidents.json are the entry points and catalog for these scenarios.
#   * 2d KB docs (runbooks/architecture/postmortems) are authored so that every
#     `expected_retrieval` id below exists, and every historical postmortem matches its incident.
#   * each scenario's `evaluation:` block states what a correct investigation of it looks like,
#     which the offline evaluation reads.
#
# Ref grammar (see README.md). Evidence refs use the frozen Evidence.source set:
#   logs:<service>:<event_id>            metrics:<service>:<metric>@<ts>
#   deploys:<service>:<deploy_id>        deps:<from>-><to>
# Retrieval ids use KB namespaces: runbook:<id> | architecture:<id> | postmortem:<incident_id>
#
# type: historical -> seeds a postmortem, expected_intent known_issue, expected_match set.
# type: novel      -> first-time investigation, expected_intent novel_investigation.

scenarios:
  # ---------------------------------------------------------------------------- historical
  - id: inc-001
    title: Payment authorizations timing out
    type: historical
    severity: SEV2
    category: payment
    occurred_at: 2026-05-12T14:30:00Z
    alert:
      summary: Elevated checkout failures; payment authorizations timing out.
      signal: checkout-api 5xx rate > 5% sustained 10m
    expected_intent: known_issue
    expected_match: postmortem:inc-001
    trigger: A config change cut payment-api's Cosmos DB connection pool from 100 to 10, starving connections under load.
    root_cause: >-
      payment-api exhausted its Cosmos DB connection pool, so payment authorizations queued and
      timed out. The failures surfaced upstream as 5xx at checkout-api.
    impacted_chain: [cosmos-db, payment-api, checkout-api]
    expected_evidence:
      - logs:payment-api:evt-001-01            # connection-pool-exhausted timeout
      - logs:checkout-api:evt-001-02           # 503 from payment-api dependency call
      - metrics:payment-api:p95_latency_ms@2026-05-12T14:25:00Z
      - metrics:checkout-api:http_5xx_rate@2026-05-12T14:30:00Z
      - deploys:payment-api:dep-20260512-01    # the pool config change
      - deps:checkout-api->payment-api
    expected_retrieval:
      - runbook:payment-timeout
      - runbook:checkout-api-500-errors
      - architecture:service-dependency-map
    resolution: Reverted the connection-pool config to 100 and added an alert on pool saturation.
    # Machine-checkable recurrence signature (mirrored in the postmortem frontmatter; the fast
    # path verifies a candidate match against these before trusting the stored resolution).
    verification:
      required_signals:            # class-level descriptors — see README "Signal descriptors"
        - logs:payment-api:error
        - metrics:payment-api:p95_latency_ms
        - metrics:checkout-api:http_5xx_rate
      disqualifying_signals:
        - metrics:cosmos-db:ru_throttled_rate   # Cosmos throttling means the inc-002 pattern, not pool starvation
      affected_versions:
        - payment-api@2.4.1                     # the pool-config deploy (dep-20260512-01)
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          Cosmos DB connection exhaustion at payment-api stated as a connection-pool or
          connection-limit problem rather than by its configuration change
      absent_evidence: []
      accepted_outcomes: [complete, partial]
      behavior_tested: >-
        A known failure mode with a clear upstream cause: the 5xx visible at checkout-api must be
        attributed to payment-api rather than to the service where it surfaced.
      knowledge_should: >-
        Its runbook and the dependency map should inform the account; this scenario has a
        postmortem of its own, so precedent may confirm the mechanism but must not stand as
        evidence that it recurred.
      expected_recommendation: >-
        Restore payment-api's Cosmos connection pool capacity; a recommendation to change
        checkout-api would follow the symptom rather than the cause.

  - id: inc-002
    title: Cosmos DB throttling cascading to reads
    type: historical
    severity: SEV2
    category: datastore
    occurred_at: 2026-05-28T09:15:00Z
    alert:
      summary: Inventory and catalog reads failing intermittently with 429s.
      signal: cosmos-db throttled-request rate spiking
    expected_intent: known_issue
    expected_match: postmortem:inc-002
    trigger: A catalog bulk import issued an unindexed query, spiking Cosmos RU consumption into throttling.
    root_cause: >-
      cosmos-db hit its provisioned RU ceiling and began returning 429s, throttling inventory-api
      and catalog-api reads, which degraded availability checks at checkout.
    impacted_chain: [cosmos-db, inventory-api, checkout-api]
    expected_evidence:
      - logs:inventory-api:evt-002-01          # 429 TooManyRequests from cosmos
      - logs:catalog-api:evt-002-02            # 429 TooManyRequests from cosmos
      - metrics:cosmos-db:ru_throttled_rate@2026-05-28T09:15:00Z
      - metrics:cosmos-db:used_ru_pct@2026-05-28T09:15:00Z
      - metrics:inventory-api:p95_latency_ms@2026-05-28T09:20:00Z
      - deploys:catalog-api:dep-20260528-01    # the bulk-import job rollout
      - deps:inventory-api->cosmos-db
    expected_retrieval:
      - runbook:cosmos-db-throttling
      - architecture:retailease-system-overview
      - architecture:service-dependency-map
    resolution: Added the missing composite index, throttled the import job, and raised the RU floor.
    verification:
      required_signals:
        - metrics:cosmos-db:ru_throttled_rate
        - logs:inventory-api:error
      disqualifying_signals:
        - metrics:redis-cache:evicted_keys_rate  # an eviction storm points at the cache, not RU throttling
      affected_versions:
        - catalog-api@1.9.0                      # the bulk-import rollout (dep-20260528-01)
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          Cosmos DB throttling stated as RU exhaustion, provisioned-throughput limit, or 429s
          against the shared account
      absent_evidence:
        - capability: get_deployments
          why: >-
            No deployment touched the impacted chain in this incident's window. A correct
            investigation reports that the change history was checked and held nothing, rather
            than leaving a deploy unexamined or asserting one.
      accepted_outcomes: [complete, partial]
      behavior_tested: >-
        A shared-dependency ceiling reached by one consumer degrading several: the cause is the
        store, not any one of the services showing errors.
      knowledge_should: >-
        The throttling runbook and the system overview should inform the account; the dependency
        map should explain why several services degraded together.
      expected_recommendation: >-
        Raise or rebalance provisioned throughput, or reduce the read pressure causing it;
        restarting a throttled consumer is not a fix.

  - id: inc-003
    title: Service Bus backlog; order notifications delayed
    type: historical
    severity: SEV3
    category: messaging
    occurred_at: 2026-06-10T20:00:00Z
    alert:
      summary: Order notifications delayed; Service Bus queue depth climbing.
      signal: service-bus active message count rising, not draining
    expected_intent: known_issue
    expected_match: postmortem:inc-003
    trigger: A bad notification-worker deploy crash-looped on a poison message, so the worker stopped draining the queue.
    root_cause: >-
      notification-worker entered a crash loop on an undeserializable message and stopped consuming
      from service-bus. Queue depth grew unbounded and order notifications were delayed.
    impacted_chain: [notification-worker, service-bus]
    expected_evidence:
      - logs:notification-worker:evt-003-01    # unhandled deserialization exception, crash loop
      - metrics:service-bus:active_message_count@2026-06-10T20:10:00Z
      - metrics:notification-worker:restart_count@2026-06-10T20:05:00Z
      - metrics:notification-worker:msg_processed_rate@2026-06-10T20:10:00Z
      - deploys:notification-worker:dep-20260610-01
      - deps:notification-worker->service-bus
    expected_retrieval:
      - runbook:service-bus-backlog
      - runbook:deployment-rollback
      - architecture:observability-strategy
    resolution: Rolled back the worker deploy, dead-lettered the poison message, and reprocessed the backlog.
    verification:
      required_signals:
        - metrics:service-bus:active_message_count
        - metrics:notification-worker:restart_count
        - logs:notification-worker:error
      disqualifying_signals:
        - metrics:checkout-api:http_5xx_rate     # checkout impact contradicts "confined to async notifications"
      affected_versions:
        - notification-worker@3.1.0              # the crash-looping revision (dep-20260610-01)
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          A poison or undeserializable message stopping the consumer, stated as a crash loop, a
          stalled consumer, or a failure to drain
      absent_evidence: []
      accepted_outcomes: [complete, partial]
      behavior_tested: >-
        A queue backlog whose cause is the consumer rather than the queue: growing depth is the
        symptom, and the worker's restarts are what explain it.
      knowledge_should: >-
        The backlog runbook should inform the account. This is the incident inc-007 later recurs
        from, so what is written here is the precedent that scenario depends on.
      expected_recommendation: >-
        Remove or dead-letter the poison message and drain the backlog; scaling the queue would
        not restart consumption.

  # --------------------------------------------------------------------------------- novel
  - id: inc-004
    title: checkout-api 500s after the morning deploy
    type: novel
    severity: SEV1
    category: payment
    occurred_at: 2026-06-28T10:15:00Z
    # DEMO 1. Misdirection scenario: the 09:00 checkout-api deploy is a RED HERRING; the real
    # cause is downstream payment-gateway latency. The agent must verify the deploy hypothesis
    # against evidence rather than rolling back checkout-api on a coincidence.
    alert:
      summary: checkout-api returning 500s shortly after this morning's deployment.
      signal: checkout-api 5xx rate > 8% sustained 5m
    expected_intent: novel_investigation
    expected_match: null
    trigger: An external payment-gateway latency spike made payment-api authorization calls time out, surfacing as 500s at checkout.
    root_cause: >-
      The third-party payment-gateway latency spiked and payment-api authorization calls timed out,
      so checkout-api returned 500s. The 09:00 checkout-api deploy was coincidental and not causal.
    impacted_chain: [payment-gateway, payment-api, checkout-api]
    red_herring: deploys:checkout-api:dep-20260628-01   # present in telemetry, must be ruled out
    expected_evidence:
      - logs:checkout-api:evt-004-01           # 500 InternalServerError on /checkout
      - logs:payment-api:evt-004-02            # PaymentGatewayTimeout
      - metrics:payment-api:p95_latency_ms@2026-06-28T10:10:00Z
      - metrics:checkout-api:http_5xx_rate@2026-06-28T10:15:00Z
      - deploys:checkout-api:dep-20260628-01   # the red-herring deploy
      - deps:checkout-api->payment-api
    expected_retrieval:
      - runbook:checkout-api-500-errors
      - runbook:payment-timeout
      - runbook:deployment-rollback
      - architecture:service-dependency-map
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          Third-party payment-gateway latency or timeouts stated as an external dependency
          failure, with the deploy explicitly cleared rather than unmentioned
      absent_evidence: []
      accepted_outcomes: [partial, inconclusive, complete]
      behavior_tested: >-
        Ambiguity handled honestly. A checkout-api deploy landed shortly before the errors and is
        the obvious suspect; the evidence clears it, and the scenario tests whether the red
        herring is examined and set aside rather than accepted because it is temporally close.
      knowledge_should: >-
        The rollback runbook may be consulted, and consulting it should lead to not rolling back:
        the deploy is cleared by evidence.
      expected_recommendation: >-
        Address the payment-gateway path, by shedding load or failing it to a timeout-and-retry
        posture. Recommending a rollback of the checkout-api deploy is wrong here, because the
        evidence clears it.

  - id: inc-005
    title: Redis eviction storm degrading checkout latency
    type: novel
    severity: SEV2
    category: cache
    occurred_at: 2026-06-22T11:45:00Z
    alert:
      summary: Checkout latency up and some carts/sessions dropping.
      signal: checkout-api p95 latency > 2x baseline
    expected_intent: novel_investigation
    expected_match: null
    trigger: redis-cache reached its memory ceiling and entered an eviction storm, dropping cart/session keys.
    root_cause: >-
      redis-cache hit max memory and began evicting cart/session keys aggressively. checkout-api fell
      back to slower Cosmos reads and lost some sessions, raising latency.
    impacted_chain: [redis-cache, checkout-api]
    expected_evidence:
      - logs:checkout-api:evt-005-01           # session-not-found / cache-miss surge
      - metrics:redis-cache:used_memory_pct@2026-06-22T11:35:00Z
      - metrics:redis-cache:evicted_keys_rate@2026-06-22T11:40:00Z
      - metrics:redis-cache:hit_rate@2026-06-22T11:40:00Z
      - metrics:checkout-api:p95_latency_ms@2026-06-22T11:45:00Z
      - deps:checkout-api->redis-cache
    expected_retrieval:
      - runbook:redis-cache-degradation
      - architecture:service-dependency-map
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          Redis memory pressure stated as eviction, a maxmemory ceiling, or cache capacity loss
          degrading checkout
      absent_evidence:
        - capability: get_deployments
          why: >-
            No deployment touched the impacted chain in this incident's window. The cause is
            capacity rather than change, and a correct investigation says the change history was
            checked and held nothing.
      accepted_outcomes: [complete, partial, inconclusive]
      behavior_tested: >-
        A capacity cause with no change to blame: nothing was deployed, so an account that reaches
        for a deploy has invented one.
      knowledge_should: >-
        The cache-degradation runbook should inform the account and the remedy.
      expected_recommendation: >-
        Raise the cache memory ceiling or tune eviction, and alert on eviction rate.

  - id: inc-006
    title: Inventory overselling from stale cache after deploy
    type: novel
    severity: SEV2
    category: inventory
    occurred_at: 2026-06-25T16:20:00Z
    alert:
      summary: Reservation conflicts and oversells at checkout.
      signal: inventory-api reservation error rate elevated
    expected_intent: novel_investigation
    expected_match: null
    trigger: >-
      An inventory-api deploy removed cache invalidation on stock writes, and a concurrent
      promotional-traffic surge pushed inventory-api's reservation queue past its normal depth;
      together, stale Redis data and a backlog of queued reservation checks let oversells through.
    root_cause: >-
      Two conditions combined, neither sufficient alone. An inventory-api deploy dropped cache
      invalidation on stock writes, so redis-cache kept serving stale availability. Independently, a
      promotional-traffic surge pushed inventory-api's reservation queue past its normal depth. Stale
      availability alone would have caused only occasional oversells; a deep reservation queue alone
      would have caused slow reservations, not conflicts. Together, checkout-api reservations
      conflicted and oversold.
    impacted_chain: [inventory-api, redis-cache, checkout-api]
    expected_evidence:
      - logs:inventory-api:evt-006-01          # StockReservationConflict / oversell
      - logs:checkout-api:evt-006-02           # reserve failed downstream
      - metrics:inventory-api:reservation_error_rate@2026-06-25T16:20:00Z
      - metrics:inventory-api:reservation_queue_depth@2026-06-25T16:15:00Z  # the traffic-surge contributor
      - metrics:redis-cache:stale_read_rate@2026-06-25T16:20:00Z           # the stale-cache contributor
      - deploys:inventory-api:dep-20260625-01  # causal deploy (the cache-invalidation half)
      - deps:inventory-api->redis-cache
    expected_retrieval:
      - runbook:deployment-rollback
      - runbook:redis-cache-degradation
      - architecture:service-dependency-map
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          Stale cached stock after an inventory-api deploy dropped cache invalidation, stated as
          two conditions combining rather than either alone
      absent_evidence: []
      accepted_outcomes: [partial, complete]
      behavior_tested: >-
        Multiple contributors recognized. Neither the deploy nor the cache behaviour is sufficient
        alone, and an account naming only one has not explained the oversell.
      knowledge_should: >-
        The rollback and cache-degradation runbooks should both inform the account, because the
        remedy involves the deploy and the stale keys together.
      expected_recommendation: >-
        Roll back the inventory-api deploy, flush the stale stock keys, and reconcile
        reservations. A recommendation addressing only one of the two leaves the oversell
        possible.

  # ---------------------------------------------------------------------------- recurrence
  - id: inc-007
    title: Service Bus backlog again; order notifications delayed (recurrence of inc-003)
    type: recurrence
    severity: SEV3
    category: messaging
    occurred_at: 2026-07-02T09:30:00Z
    # GENUINE RECURRENCE (Demo 2). A stale release pipeline re-deployed notification-worker@3.1.0
    # — the same revision line that lacked poison-message handling (inc-003's action item never
    # shipped) — and the crash loop recurred on a new malformed message. New incident id, no
    # postmortem of its own: the fast path must match it to postmortem:inc-003 and VERIFY the
    # match against that postmortem's required/disqualifying signals + affected_versions.
    alert:
      summary: Order notifications delayed again; Service Bus queue depth climbing and not draining.
      signal: service-bus active message count rising, not draining
    expected_intent: known_issue
    expected_match: postmortem:inc-003
    trigger: A stale pipeline re-deployed the notification-worker revision lacking poison-message handling; a new malformed message restarted the crash loop.
    root_cause: >-
      notification-worker crash-looped again on an undeserializable message — the poison-message
      handling from inc-003's action items was never shipped, and a re-deploy of the affected
      revision reintroduced the failure mode. Queue depth grew and order notifications were delayed.
    impacted_chain: [notification-worker, service-bus]
    expected_evidence:
      - logs:notification-worker:evt-007-01    # deserialization crash loop (again)
      - metrics:service-bus:active_message_count@2026-07-02T09:40:00Z
      - metrics:notification-worker:restart_count@2026-07-02T09:35:00Z
      - metrics:notification-worker:msg_processed_rate@2026-07-02T09:40:00Z
      - deploys:notification-worker:dep-20260702-01   # re-deploy of the affected revision
      - deps:notification-worker->service-bus
    expected_retrieval:
      - postmortem:inc-003
      - runbook:service-bus-backlog
      - runbook:deployment-rollback
    # What a correct investigation of this scenario looks like, for the offline
    # evaluation. Authored: nothing here is derived from a model run.
    evaluation:
      acceptable_alternatives:
        - >-
          The same poison-message crash loop as inc-003, stated as a recurrence or as the
          unshipped action item from it
      absent_evidence: []
      accepted_outcomes: [complete, partial]
      behavior_tested: >-
        Recurrence recognized from precedent. The signature matches an incident the corpus already
        has a postmortem for, and this is the scenario where retrieved knowledge is expected to
        change the investigation rather than decorate it.
      knowledge_should: >-
        inc-003's postmortem should be retrieved and should change the account: the recurrence is
        named, and its verified resolution is what the recommendation rests on. This is the
        scenario the retrieval-influence comparison runs on.
      expected_recommendation: >-
        Apply inc-003's verified resolution, and ship the poison-message handling that incident's
        action items called for and which was never delivered.
