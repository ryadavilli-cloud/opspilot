# Golden scenario records: what a correct investigation must ESTABLISH, per incident.
#
# Shape is the eight-part model `docs/evaluation.md` section 5 fixes. This file is authored
# beside `scenarios.yaml`, not generated from it: `scenarios.yaml` and its projection
# (`build_goldens.py` -> `eval/golden_incidents.json`) are the answer key and stay unchanged.
# The answer key says what happened; a golden record says what a correct investigation must
# reach, which is a different and smaller claim.
#
# What a golden record deliberately does NOT contain (evaluation.md section 5): expected prose,
# a full expected brief, model reasoning, token budgets, prompt-specific answers, per-agent
# expected messages, or an exact tool-call sequence. Two different but valid evidence paths that
# establish the same required evidence are both correct, which is why `required_evidence` is a
# list of things to establish with acceptable reference sets, not an ordered checklist.
#
# Two distinct ideas live under part 6 and are kept in separate fields on purpose:
#   `weakens_candidate`    references that DO resolve in the corpus, carrying a flat or normal
#                          reading that rules a competing hypothesis out. These are checked by
#                          the closure test like any other reference.
#   `deliberately_absent`  evidence the corpus does not contain at all. These CANNOT be
#                          references, because a reference to them would not resolve; they are
#                          prose, and the closure test does not treat them as references.
#
# The benign/transient class is represented by `benign_fixture.yaml` and carries no golden
# record: it is a non-incident, so there is no correct investigation for it to describe.

golden_scenarios:

  - incident: inc-001
    classes:
      - clear_single_cause
    expected_cause: >-
      payment-api exhausted its Cosmos DB connection pool, queueing and timing out payment
      authorizations, which surfaced upstream as 5xx at checkout-api.
    acceptable_alternatives: []
    required_evidence:
      - establishes: payment-api is saturated and timing out, not merely slow
        any_of:
          - logs:payment-api:evt-001-01
          - metrics:payment-api:p95_latency_ms@2026-05-12T14:25:00Z
      - establishes: the failure surfaced upstream at checkout-api rather than originating there
        any_of:
          - logs:checkout-api:evt-001-02
          - metrics:checkout-api:http_5xx_rate@2026-05-12T14:30:00Z
      - establishes: the connection-pool configuration change is the trigger
        all_of:
          - deploys:payment-api:dep-20260512-01
    contradicting_or_unavailable:
      weakens_candidate:
        - reference: metrics:cosmos-db:ru_throttled_rate@2026-05-12T14:30:00Z
          rules_out: >-
            Cosmos-side throttling as the cause. The store is not throttling here, so the
            saturation is in payment-api's own pool, not in the datastore.
      deliberately_absent: []
    expected_outcome_shape:
      - complete
    required_behavior: >-
      Must distinguish the exhausted client-side pool from datastore throttling, which is the
      neighbouring failure mode inc-002 represents. Must attribute the checkout-api 5xx to a
      downstream dependency rather than to checkout-api itself.

  - incident: inc-002
    classes:
      - clear_single_cause
    expected_cause: >-
      cosmos-db reached its provisioned RU ceiling and returned 429s, throttling inventory-api
      and catalog-api reads and degrading availability checks at checkout.
    acceptable_alternatives: []
    required_evidence:
      - establishes: the datastore itself is throttling, at its provisioned ceiling
        all_of:
          - metrics:cosmos-db:ru_throttled_rate@2026-05-28T09:15:00Z
          - metrics:cosmos-db:used_ru_pct@2026-05-28T09:15:00Z
      - establishes: dependent read paths are degraded by that throttling
        any_of:
          - logs:inventory-api:evt-002-01
          - logs:catalog-api:evt-002-02
          - metrics:inventory-api:p95_latency_ms@2026-05-28T09:20:00Z
      - establishes: the unindexed bulk-import query is the trigger
        all_of:
          - deploys:catalog-api:dep-20260528-01
    contradicting_or_unavailable:
      weakens_candidate:
        - reference: metrics:redis-cache:evicted_keys_rate@2026-05-28T09:15:00Z
          rules_out: >-
            Cache eviction as the cause of the read failures. The cache is healthy, so the
            degradation is on the datastore path.
      deliberately_absent: []
    expected_outcome_shape:
      - complete
    required_behavior: >-
      Must place the cause at the shared datastore rather than at either consuming service,
      and must connect the RU ceiling to the consumers' symptoms rather than reporting two
      unrelated service faults.

  - incident: inc-003
    classes:
      - clear_single_cause
    expected_cause: >-
      notification-worker crash-looped on an undeserializable message and stopped consuming
      from service-bus, so queue depth grew unbounded and order notifications were delayed.
    acceptable_alternatives: []
    required_evidence:
      - establishes: the consumer is failing repeatedly rather than merely running slowly
        any_of:
          - logs:notification-worker:evt-003-01
          - metrics:notification-worker:restart_count@2026-06-10T20:05:00Z
      - establishes: the queue is growing because nothing is draining it
        all_of:
          - metrics:service-bus:active_message_count@2026-06-10T20:10:00Z
          - metrics:notification-worker:msg_processed_rate@2026-06-10T20:10:00Z
      - establishes: the worker deploy is the trigger
        all_of:
          - deploys:notification-worker:dep-20260610-01
    contradicting_or_unavailable:
      weakens_candidate:
        - reference: metrics:checkout-api:http_5xx_rate@2026-06-10T20:10:00Z
          rules_out: >-
            A broader customer-facing outage. The failure is confined to the asynchronous
            notification path, which is why this is SEV3 rather than SEV1.
      deliberately_absent: []
    expected_outcome_shape:
      - complete
    required_behavior: >-
      Must identify the stalled consumer as the cause of the backlog rather than treating
      growing queue depth as the fault itself. Rising depth and zero throughput must be read
      together; either alone is consistent with a merely slow consumer.

  - incident: inc-004
    classes:
      - competing_or_ambiguous_hypotheses
      - sparse_or_unavailable_evidence
    expected_cause: >-
      The third-party payment-gateway's latency spiked, so payment-api authorization calls timed
      out and checkout-api returned 500s. The 09:00 checkout-api deploy was coincidental.
    acceptable_alternatives:
      - >-
        An assessment may keep the checkout-api deploy open as an unresolved question where it
        states plainly that the evidence does not support it as the cause. It may not present
        the deploy as the cause, and it may not present it as equally supported.
    required_evidence:
      - establishes: the timeouts originate downstream of checkout-api, at the payment path
        any_of:
          - logs:payment-api:evt-004-02
          - metrics:payment-api:p95_latency_ms@2026-06-28T10:10:00Z
      - establishes: checkout-api is surfacing the failure rather than causing it
        any_of:
          - logs:checkout-api:evt-004-01
          - metrics:checkout-api:http_5xx_rate@2026-06-28T10:15:00Z
      - establishes: the coincidental deploy was examined and cleared, not ignored
        all_of:
          - deploys:checkout-api:dep-20260628-01
    contradicting_or_unavailable:
      weakens_candidate:
        - reference: deploys:checkout-api:dep-20260628-01
          rules_out: >-
            Itself, as the cause. The deploy is real and temporally adjacent, but the payment
            path degrades independently of it. This reference is required evidence AND the
            red herring: reaching it is correct, concluding from it is not.
      deliberately_absent:
        - >-
          payment-gateway is a third party and carries no metric series anywhere in the corpus.
          The root cause is therefore never directly observable; it is established by the
          downstream timeout pattern plus the absence of any internal explanation. A correct
          assessment discloses this as a limitation rather than asserting gateway behavior it
          cannot see.
    expected_outcome_shape:
      - complete
    required_behavior: >-
      The discriminator this scenario exists to test: a temporally adjacent deploy must not be
      accepted as causal on adjacency alone. Must disclose the unobservable third party as an
      explicit limitation. Must not recommend rolling back the checkout-api deploy, which the
      evidence clears.

  - incident: inc-005
    classes:
      - clear_single_cause
    expected_cause: >-
      redis-cache reached its memory ceiling and evicted cart and session keys aggressively, so
      checkout-api fell back to slower Cosmos reads, raising latency and dropping some sessions.
    acceptable_alternatives: []
    required_evidence:
      - establishes: the cache is at its ceiling and evicting, not merely cold
        all_of:
          - metrics:redis-cache:used_memory_pct@2026-06-22T11:35:00Z
          - metrics:redis-cache:evicted_keys_rate@2026-06-22T11:40:00Z
      - establishes: the eviction is degrading the cache's usefulness rather than being benign
        all_of:
          - metrics:redis-cache:hit_rate@2026-06-22T11:40:00Z
      - establishes: the user-visible symptom follows from that degradation
        any_of:
          - logs:checkout-api:evt-005-01
          - metrics:checkout-api:p95_latency_ms@2026-06-22T11:45:00Z
    contradicting_or_unavailable:
      weakens_candidate: []
      deliberately_absent:
        - >-
          No deployment exists anywhere in this incident's window; it is the only authored
          incident with no deploy at all. A correct investigation that checks change history
          finds nothing and must not manufacture a change-related cause from that emptiness.
    expected_outcome_shape:
      - complete
    required_behavior: >-
      Must trace a resource ceiling through to a user-visible symptom across a service boundary.
      Must treat the empty change history as informative rather than as a gap to fill, which is
      the inverse of the discriminator inc-004 tests.

  - incident: inc-006
    classes:
      - multiple_contributing_failures
      - competing_or_ambiguous_hypotheses
    expected_cause: >-
      Two conditions combined, neither sufficient alone: an inventory-api deploy dropped cache
      invalidation on stock writes, so redis-cache served stale availability, while a concurrent
      promotional surge pushed the reservation queue past its normal depth. Together they
      produced reservation conflicts and oversells.
    acceptable_alternatives:
      - >-
        An assessment that establishes only one of the two contributing conditions, and states
        plainly that the single condition does not explain all observed signals, is a correct
        partial result. An assessment that presents either condition alone as the complete cause
        is incorrect.
    required_evidence:
      - establishes: the stale-cache contributing condition
        all_of:
          - metrics:redis-cache:stale_read_rate@2026-06-25T16:20:00Z
          - deploys:inventory-api:dep-20260625-01
      - establishes: the concurrent capacity contributing condition, independent of the first
        all_of:
          - metrics:inventory-api:reservation_queue_depth@2026-06-25T16:15:00Z
      - establishes: the user-visible conflict the two conditions jointly produce
        any_of:
          - logs:inventory-api:evt-006-01
          - logs:checkout-api:evt-006-02
          - metrics:inventory-api:reservation_error_rate@2026-06-25T16:20:00Z
    contradicting_or_unavailable:
      weakens_candidate: []
      deliberately_absent:
        - >-
          Neither contributing condition has evidence that it alone produced oversells, because
          neither did. A correct assessment cannot find single-cause support here, and the
          absence of it is the finding rather than a gap.
    expected_outcome_shape:
      - complete
      - partial
    required_behavior: >-
      The scenario this corpus carries for the multiple-contributing-failures class. Must state
      that one cause does not explain all signals. The deploy is genuinely contributory here,
      which makes this the deliberate foil to inc-004, where a deploy is genuinely coincidental:
      the two scenarios must not be resolved by the same heuristic.

  - incident: inc-007
    classes:
      - clear_single_cause
    expected_cause: >-
      notification-worker crash-looped again on an undeserializable message. The poison-message
      handling from inc-003's action items was never shipped, and a re-deploy of the affected
      revision reintroduced the failure mode.
    acceptable_alternatives: []
    required_evidence:
      - establishes: the same stalled-consumer failure mode as before
        any_of:
          - logs:notification-worker:evt-007-01
          - metrics:notification-worker:restart_count@2026-07-02T09:35:00Z
      - establishes: the queue is again growing because nothing is draining it
        all_of:
          - metrics:service-bus:active_message_count@2026-07-02T09:40:00Z
          - metrics:notification-worker:msg_processed_rate@2026-07-02T09:40:00Z
      - establishes: this is a recurrence of a known error, not a novel fault
        all_of:
          - postmortem:inc-003
          - deploys:notification-worker:dep-20260702-01
    contradicting_or_unavailable:
      weakens_candidate:
        - reference: metrics:checkout-api:http_5xx_rate@2026-07-02T09:40:00Z
          rules_out: >-
            A broader outage, on the same reasoning as inc-003.
      deliberately_absent: []
    expected_outcome_shape:
      - complete
    required_behavior: >-
      Must match against the known error rather than investigating from scratch, and must reach
      that match through retrieved knowledge: the redeployed revision is the same version
      inc-003 named, and the postmortem's recurrence signature is what identifies it. This is
      the scenario in which retrieved knowledge most changes the investigation's path.
